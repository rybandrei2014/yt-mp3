<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yt-mp3</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root { color-scheme: dark; --ctl: 44px; --ctl-sm: 32px; --link: #ef8a8f; }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; overflow-y: scroll; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center;
    font-family: system-ui, sans-serif; background: #0f1115; color: #e6e6e6;
  }
  main { width: 100%; max-width: 640px; padding: 40px 20px; }
  a { color: var(--link); }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 30px 0 10px; }
  .sub { color: #8a8f98; font-size: .9rem; margin-bottom: 24px; }
  .row { display: flex; gap: 8px; }
  input[type=url] {
    width: 100%; height: var(--ctl); padding: 0 104px 0 14px; border-radius: 8px; border: 1px solid #2a2f3a;
    background: #171a21; color: #e6e6e6; font-size: 1rem;
  }
  #urlRow { position: relative; }
  #previewBtn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); padding: 0 16px; }
  button {
    display: inline-flex; align-items: center; justify-content: center;
    height: var(--ctl); padding: 0 18px; border: 0; border-radius: 8px; background: #c9474c;
    color: #fff; font-size: 1rem; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.ghost { background: #232833; }
  button.danger { background: #c9474c; border-color: #c9474c; color: #fff; }
  button.danger:hover { background: #b23a3f; }
  button.small { height: var(--ctl-sm); padding: 0 12px; font-size: .82rem; }
  input, button { accent-color: #c9474c; }
  input:focus { outline: 2px solid #c9474c; outline-offset: 1px; border-color: #c9474c; }
  #libSearch:focus { border-color: #c9474c; }
  button:focus-visible { outline: 2px solid #c9474c; outline-offset: 2px; }
  ::selection { background: #c9474c; color: #fff; }
  #preview { display: none; margin-top: 20px; gap: 14px; align-items: center; }
  #preview img { width: 168px; border-radius: 8px; }
  #preview .meta { font-size: .9rem; color: #aab0ba; }
  #preview .title { font-size: 1.05rem; color: #e6e6e6; margin-bottom: 6px; }
  #quality { display: none; margin-top: 20px; }
  .qlabel {
    display: block; padding: 10px 12px; margin-bottom: 6px; border-radius: 8px;
    background: #171a21; border: 1px solid #2a2f3a; cursor: pointer; font-size: .95rem;
  }
  .qlabel:has(input:checked) { border-color: #c9474c; }
  #actions { display: none; margin-top: 16px; gap: 8px; }
  #progressWrap { display: none; margin-top: 20px; }
  .bar { height: 8px; border-radius: 4px; background: #232833; overflow: hidden; }
  .bar > div { height: 100%; width: 0%; background: #c9474c; transition: width .3s; }
  #status { font-size: .85rem; color: #8a8f98; margin-top: 6px; }
  #error { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 8px;
    background: #3a2225; color: #e8b0b3; font-size: .9rem; word-break: break-word; }
  #save { display: none; margin-top: 16px; }
  #results { display: none; margin-top: 16px; font-size: .9rem; }
  #results div { padding: 6px 0; border-bottom: 1px solid #1c2029; }
  #results a { color: var(--link); }
  #results .fail { color: #e8b0b3; }
  #library { margin-top: 10px; }
  #libSearchRow { display: none; position: relative; margin-top: 4px; }
  #libSearch {
    width: 100%; height: var(--ctl); padding: 0 44px 0 36px; border-radius: 8px; border: 1px solid #2a2f3a;
    background-color: #171a21; color: #e6e6e6; font-size: 1rem;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%238a8f98'%20stroke-width='2.5'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Ccircle%20cx='11'%20cy='11'%20r='7'/%3E%3Cpath%20d='M20%2020l-4.35-4.35'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: 12px center; background-size: 15px 15px;
  }
  #libSearch::-webkit-search-cancel-button { -webkit-appearance: none; }
  #libSearchClear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    height: var(--ctl-sm); padding: 0 10px; background: transparent; border: 0; color: #8a8f98;
  }
  #libSearchClear:hover { background: #232833; color: #e6e6e6; }
  .libRow {
    display: flex; align-items: center; gap: 10px; padding: 5px 12px; margin-bottom: 6px;
    min-height: var(--ctl);
    background: #171a21; border: 1px solid #2a2f3a; border-radius: 8px; font-size: .88rem;
    animation: libIn .32s cubic-bezier(.22,.61,.36,1) both;
  }
  @keyframes libIn {
    from { opacity: 0; transform: translateY(14px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .libRow { animation: none; } }
  .libRow .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  img.cover {
    width: 32px; height: 32px; border-radius: 6px; object-fit: cover;
    flex-shrink: 0; background: #232833;
  }
  .libRow .dur { color: #8a8f98; font-size: .8rem; white-space: nowrap; }
  .libRow a { color: var(--link); text-decoration: none; }
  #libEmpty { color: #8a8f98; font-size: .88rem; }
  .spinner {
    width: 22px; height: 22px; margin: 14px auto; border: 3px solid #2a2f3a;
    border-top-color: #c9474c; border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toTop {
    display: none; position: fixed; right: 20px; bottom: 20px; z-index: 5;
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid #2a2f3a;
    background: #0f1115; color: #c9474c; cursor: pointer; padding: 0;
    box-shadow: 0 4px 14px rgba(0,0,0,.5); transition: border-color .2s, transform .2s;
  }
  #toTop:hover { border-color: #c9474c; transform: translateY(-2px); }
  #toTop svg { display: block; margin: auto; }
  /* modal */
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65);
    z-index: 10; justify-content: center; align-items: center; padding: 20px;
  }
  .modal-box {
    background: #171a21; border: 1px solid #2a2f3a; border-radius: 12px;
    width: 100%; max-width: 560px; max-height: 85vh; display: flex; flex-direction: column;
    padding: 20px;
  }
  .modal-box h3 { margin: 0 0 12px; font-size: 1.05rem; word-break: break-word; }
  #plList { overflow-y: auto; flex: 1; margin: 10px 0; }
  .entry {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; border: 1px solid transparent;
  }
  .entry:hover { background: #1d222c; }
  .entry:has(input:checked) { border-color: #3a4150; }
  .entry img { width: 96px; border-radius: 4px; }
  .entry .t { font-size: .9rem; flex: 1; }
  .entry .d { font-size: .8rem; color: #8a8f98; white-space: nowrap; }
  .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
  .modal-actions .spacer { flex: 1; }
  #trimModal .modal-box { max-width: 960px; width: 94vw; }
  #trimModal .modal-box.expanded { max-width: 98vw; width: 98vw; height: 94vh; }
  #trimModal .modal-box.expanded #waveWrap { flex: 1; }
  #trimModal .modal-box.expanded #wave { height: 100%; min-height: 220px; }
  .modal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .modal-head h3 { flex: 1; margin: 0; }
  #waveWrap { position: relative; background: #0f1115; border: 1px solid #2a2f3a; border-radius: 8px; overflow: hidden; }
  #wave { display: block; width: 100%; height: 220px; cursor: crosshair; touch-action: none; }
  #waveMsg {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: #8a8f98; font-size: .9rem; pointer-events: none;
  }
  .trimTimes { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .trimTimes input {
    width: 70px; height: var(--ctl-sm); padding: 0 10px; border-radius: 8px; border: 1px solid #2a2f3a;
    background: #0f1115; color: #e6e6e6; font-size: .9rem; text-align: center;
  }
  .trimTimes .dash { color: #8a8f98; }
  #trimResult { display: none; margin-top: 10px; font-size: .9rem; }
  #trimResult a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>yt-mp3</h1>
  <div class="sub">Best-quality audio from any YouTube video or playlist — no re-encode by default.</div>

  <div id="urlRow">
    <input id="url" type="url" placeholder="Paste YouTube URL..." autofocus>
    <button id="previewBtn" class="small">Preview</button>
  </div>

  <div id="preview">
    <img id="thumb" alt="">
    <div>
      <div class="title" id="pTitle"></div>
      <div class="meta" id="pMeta"></div>
    </div>
  </div>

  <div id="quality">
    <label class="qlabel"><input type="radio" name="q" value="opus" checked> Opus (.opus, lossless remux — recommended)</label>
    <label class="qlabel"><input type="radio" name="q" value="best"> Original stream (.webm, zero processing)</label>
    <label class="qlabel"><input type="radio" name="q" value="m4a"> M4A (AAC, compatible)</label>
    <label class="qlabel"><input type="radio" name="q" value="mp3"> MP3 (VBR highest, compatible)</label>
    <label class="qlabel"><input type="checkbox" id="coverChk"> Save cover art as separate .png file</label>
  </div>

  <div class="row" id="actions">
    <button id="dlBtn">Download</button>
    <button id="resetBtn" class="ghost">New</button>
  </div>

  <div id="progressWrap">
    <div class="bar"><div id="bar"></div></div>
    <div id="status"></div>
  </div>

  <div id="error"></div>
  <div id="save">Saved: <a id="saveLink" href="#"></a></div>
  <div id="results"></div>

  <h2>Library</h2>
  <div id="libSearchRow">
    <input id="libSearch" type="search" placeholder="Search library by filename..." autocomplete="off">
    <button id="libSearchClear" class="ghost small" style="visibility:hidden">✕</button>
  </div>
  <div id="library"></div>
  <div id="libSpinner" class="spinner" style="display:none"></div>
  <div id="libEmpty" style="display:none">Nothing downloaded yet.</div>
  <div id="libSentinel"></div>
</main>

<button id="toTop" title="Scroll to top" aria-label="Scroll to top">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
  </svg>
</button>

<div id="plModal" class="modal">
  <div class="modal-box">
    <h3 id="plTitle"></h3>
    <div class="sub" id="plMeta"></div>
    <div class="row">
      <button class="ghost small" id="selAll">Select all</button>
      <button class="ghost small" id="selNone">Select none</button>
    </div>
    <div id="plList"></div>
    <div>
      <label class="qlabel"><input type="checkbox" id="plCoverChk"> Save cover art as separate .png file (for all)</label>
    </div>
    <div class="modal-actions">
      <button id="plDlBtn">Download</button>
      <div class="spacer"></div>
      <button class="ghost" id="plCancel">Cancel</button>
    </div>
  </div>
</div>

<div id="trimModal" class="modal">
  <div class="modal-box">
    <div class="modal-head">
      <img id="trimCover" class="cover" alt="" style="display:none">
      <h3 id="trimTitle"></h3>
      <button id="trimExpandBtn" class="ghost small" title="Expand">⤢</button>
    </div>
    <div id="waveWrap">
      <canvas id="wave"></canvas>
      <div id="waveMsg"></div>
    </div>
    <div class="trimTimes">
      <input id="trimStart" type="text" value="0:00">
      <span class="dash">–</span>
      <input id="trimEnd" type="text" value="0:00">
      <button id="trimPlayBtn" class="ghost small">▶ Preview</button>
      <button id="trimStopBtn" class="ghost small" style="display:none">■ Stop</button>
    </div>
    <div id="trimResult"></div>
    <div class="modal-actions">
      <button id="trimCutBtn">✂ Cut</button>
      <div class="spacer"></div>
      <button class="ghost" id="trimCancel">Close</button>
    </div>
  </div>
</div>

<div id="delModal" class="modal">
  <div class="modal-box" style="max-width:440px">
    <h3 id="delTitle"></h3>
    <div class="sub">The file is removed from disk. This cannot be undone.</div>
    <div class="modal-actions">
      <button id="delConfirm" class="danger">Delete</button>
      <div class="spacer"></div>
      <button class="ghost" id="delCancel">Cancel</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let previewInfo = null;

function fmtDur(s) {
  if (s == null) return '';
  const m = Math.floor(s / 60), sec = String(Math.floor(s % 60)).padStart(2, '0');
  return `${m}:${sec}`;
}
function parseTime(s) {
  if (!s) return null;
  if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  const m = s.match(/^(\d+):([0-5]?\d)(?::([0-5]?\d))?$/);
  if (!m) return null;
  const [, a, b, c] = m;
  return c !== undefined ? +a * 3600 + +b * 60 + +c : +a * 60 + +b;
}
function showError(msg) { $('error').textContent = msg; $('error').style.display = 'block'; }
function hideError() { $('error').style.display = 'none'; }

/* ---------- single video flow ---------- */
$('previewBtn').onclick = async () => {
  hideError();
  const url = $('url').value.trim();
  if (!url) return;
  $('previewBtn').disabled = true;
  try {
    const r = await fetch('/api/preview', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url})
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    previewInfo = await r.json();
    if (previewInfo.type === 'playlist') openPlaylistModal(previewInfo);
    else openSingle(previewInfo);
  } catch (e) { showError(e.message); }
  finally { $('previewBtn').disabled = false; }
};

function openSingle(info) {
  $('thumb').src = info.thumbnail;
  $('pTitle').textContent = info.title;
  $('pMeta').textContent = `${info.uploader || ''} · ${fmtDur(info.duration)}`;
  $('preview').style.display = 'flex';
  $('quality').style.display = 'block';
  $('actions').style.display = 'flex';
}

$('dlBtn').onclick = async () => {
  hideError();
  const quality = document.querySelector('input[name=q]:checked').value;
  $('dlBtn').disabled = true;
  $('progressWrap').style.display = 'block';
  try {
    const r = await fetch('/api/download', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url: $('url').value.trim(), quality, cover: $('coverChk').checked})
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const {id} = await r.json();
    const es = new EventSource(`/api/job/${id}/events`);
    es.onmessage = ev => {
      const j = JSON.parse(ev.data);
      $('bar').style.width = j.progress + '%';
      $('status').textContent = j.status + (j.status === 'downloading' ? ` — ${j.progress}%` : '');
      if (j.status === 'done') {
        es.close();
        $('saveLink').href = `/api/file/${j.id}`;
        $('saveLink').textContent = j.filename;
        $('save').style.display = 'block';
        if (j.cover_filename) {
          const c = document.createElement('a');
          c.href = `/api/file/${j.id}/cover`; c.textContent = ' + ' + j.cover_filename;
          $('save').append(c);
        }
        $('dlBtn').disabled = false;
        refreshLibrary();
      } else if (j.status === 'error') {
        es.close();
        showError(j.error);
        $('dlBtn').disabled = false;
      }
    };
  } catch (e) { showError(e.message); $('dlBtn').disabled = false; }
};

$('resetBtn').onclick = () => {
  $('url').value = ''; previewInfo = null;
  ['preview','quality','actions','progressWrap','save','results'].forEach(id => $(id).style.display = 'none');
  $('bar').style.width = '0%'; hideError();
};

/* ---------- playlist flow ---------- */
function openPlaylistModal(info) {
  $('plTitle').textContent = info.title || 'Playlist';
  $('plMeta').textContent = `${info.count} videos${info.uploader ? ' · ' + info.uploader : ''}`;
  const list = $('plList');
  list.innerHTML = '';
  for (const e of info.entries) {
    const label = document.createElement('label');
    label.className = 'entry';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true; cb.dataset.url = e.url;
    const img = document.createElement('img');
    if (e.thumbnail) img.src = e.thumbnail; else img.style.visibility = 'hidden';
    const t = document.createElement('div'); t.className = 't'; t.textContent = e.title;
    const d = document.createElement('div'); d.className = 'd'; d.textContent = fmtDur(e.duration);
    label.append(cb, img, t, d);
    list.appendChild(label);
  }
  updatePlDlCount();
  $('plModal').style.display = 'flex';
}
function selectedUrls() {
  return [...document.querySelectorAll('#plList input:checked')].map(cb => cb.dataset.url);
}
function updatePlDlCount() {
  $('plDlBtn').textContent = `Download (${selectedUrls().length})`;
}
$('plList').addEventListener('change', updatePlDlCount);
$('selAll').onclick = () => { document.querySelectorAll('#plList input').forEach(cb => cb.checked = true); updatePlDlCount(); };
$('selNone').onclick = () => { document.querySelectorAll('#plList input').forEach(cb => cb.checked = false); updatePlDlCount(); };
$('plCancel').onclick = () => { $('plModal').style.display = 'none'; };

$('plDlBtn').onclick = async () => {
  hideError();
  const urls = selectedUrls();
  if (!urls.length) return;
  $('plDlBtn').disabled = true;
  $('plModal').style.display = 'none';
  $('progressWrap').style.display = 'block';
  try {
    const r = await fetch('/api/download', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url: $('url').value.trim(), quality: document.querySelector('input[name=q]:checked').value, cover: $('plCoverChk').checked, entries: urls})
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const res = await r.json();
    watchGroup(res.group);
  } catch (e) { showError(e.message); $('plDlBtn').disabled = false; }
};

function watchGroup(groupId) {
  const es = new EventSource(`/api/group/${groupId}/events`);
  es.onmessage = ev => {
    const g = JSON.parse(ev.data);
    $('bar').style.width = g.progress + '%';
    $('status').textContent = `${g.done}/${g.total} done` + (g.failed ? ` · ${g.failed} failed` : '');
    if (g.finished) {
      es.close();
      renderResults(g.items);
      $('plDlBtn').disabled = false;
      refreshLibrary();
    }
  };
}
function renderResults(items) {
  const box = $('results');
  box.innerHTML = '';
  for (const it of items) {
    const div = document.createElement('div');
    if (it.status === 'done' && it.filename) {
      const a = document.createElement('a');
      a.href = `/api/file/${it.id}`; a.textContent = it.filename;
      div.append('✓ ', a);
      if (it.cover_filename) {
        const c = document.createElement('a');
        c.href = `/api/file/${it.id}/cover`; c.textContent = ' ' + it.cover_filename;
        div.append(' + ', c);
      }
    } else {
      div.className = 'fail';
      div.textContent = `✗ ${it.title || it.id} — ${it.error || 'failed'}`;
    }
    box.appendChild(div);
  }
  box.style.display = 'block';
}

/* ---------- library (cursor-paged, infinite scroll) ---------- */
const LIB_PAGE = 50;
const lib = { cursor: null, total: 0, firstKey: null, done: false, loading: false, stale: false, q: '', gen: 0 };
function libQs(useCursor = true) {
  let qs = `limit=${LIB_PAGE}`;
  if (useCursor && lib.cursor) qs += `&after=${encodeURIComponent(lib.cursor)}`;
  if (lib.q) qs += `&q=${encodeURIComponent(lib.q)}`;
  return qs;
}
function showLibSearch() {
  $('libSearchRow').style.display = (lib.total || lib.q) ? 'block' : 'none';
}
function showLibEmpty() {
  $('libEmpty').textContent = lib.q ? `No matches for “${lib.q}”.` : 'Nothing downloaded yet.';
  $('libEmpty').style.display = lib.total ? 'none' : 'block';
}

function libRow(it, i = 0) {
  const row = document.createElement('div');
  row.className = 'libRow';
  row.style.animationDelay = `${Math.min(i, 24) * 22}ms`;
  const name = document.createElement('span');
  name.className = 'name'; name.textContent = it.filename; name.title = it.filename;
  const dur = document.createElement('span');
  dur.className = 'dur'; dur.textContent = fmtDur(it.duration);
  const trimBtn = document.createElement('button');
  trimBtn.className = 'ghost small'; trimBtn.textContent = '✂ Trim';
  trimBtn.onclick = () => openTrim(it);
  const delBtn = document.createElement('button');
  delBtn.className = 'danger small'; delBtn.textContent = '✕ Delete';
  delBtn.onclick = () => confirmDelete(it);
  it._row = row;
  const img = document.createElement('img');
  img.className = 'cover'; img.alt = ''; img.loading = 'lazy';
  img.src = `/api/library/${it.id}/cover`;
  img.onerror = () => img.remove();
  row.append(img, name, dur, trimBtn, delBtn);
  return row;
}

function resetLibrary() {
  $('library').innerHTML = '';
  lib.gen++;
  lib.cursor = null; lib.firstKey = null; lib.done = false; lib.stale = false;
}
function refreshLibrary() { resetLibrary(); loadLibrary(); }

function reloadLibrary() {
  const anchor = $('libSearchRow').getBoundingClientRect().top + scrollY - 12;
  resetLibrary();
  if (scrollY > anchor) scrollTo(0, anchor);
  loadLibrary();
}

async function silentRefresh() {
  if (lib.loading) return;
  lib.loading = true;
  const gen = ++lib.gen;
  try {
    const r = await fetch(`/api/library?${libQs(false)}`);
    const {items, total, next} = await r.json();
    if (gen === lib.gen) {
      const key = items.map(i => i.filename).join('\n');
      if (key !== lib.firstKey || total !== lib.total) {
        const box = $('library');
        box.innerHTML = '';
        const frag = document.createDocumentFragment();
        items.forEach((it, i) => frag.appendChild(libRow(it, i)));
        box.appendChild(frag);
        lib.cursor = next; lib.done = !next; lib.firstKey = key; lib.total = total;
        showLibSearch();
        showLibEmpty();
        if ($('libSentinel').getBoundingClientRect().top < innerHeight + 240) loadLibrary();
      }
    }
  } catch (e) { /* keep current list */ }
  lib.loading = false;
}

async function loadLibrary() {
  if (lib.loading || lib.done) return;
  lib.loading = true;
  const gen = lib.gen;
  $('libSpinner').style.display = 'block';
  $('libEmpty').style.display = 'none';
  try {
    const r = await fetch(`/api/library?${libQs()}`);
    const {items, total, next} = await r.json();
    if (gen === lib.gen) {
      const box = $('library');
      const frag = document.createDocumentFragment();
      items.forEach((it, i) => frag.appendChild(libRow(it, i)));
      box.appendChild(frag);
      const first = !lib.cursor;
      lib.cursor = next;
      lib.done = !next;
      lib.total = total;
      if (first) lib.firstKey = items.map(i => i.filename).join('\n');
      showLibSearch();
      showLibEmpty();
    }
  } catch (e) { }
  $('libSpinner').style.display = 'none';
  lib.loading = false;
  if (gen !== lib.gen) return;
  if (lib.stale && scrollY < 50) { lib.stale = false; silentRefresh(); return; }
  if ($('libSentinel').getBoundingClientRect().top < innerHeight + 240) loadLibrary();
}
new IntersectionObserver((es) => { if (es[0].isIntersecting) loadLibrary(); }, { rootMargin: '240px' })
  .observe($('libSentinel'));

/* ---------- library search ---------- */
let libSearchTimer = null;
$('libSearch').addEventListener('input', () => {
  const v = $('libSearch').value.trim();
  $('libSearchClear').style.visibility = v ? 'visible' : 'hidden';
  clearTimeout(libSearchTimer);
  libSearchTimer = setTimeout(() => {
    if (v === lib.q) return;
    lib.q = v;
    reloadLibrary();
  }, 250);
});
$('libSearch').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { $('libSearch').value = ''; $('libSearchClear').style.visibility = 'hidden'; }
});
$('libSearchClear').onclick = () => {
  $('libSearch').value = '';
  $('libSearchClear').style.visibility = 'hidden';
  clearTimeout(libSearchTimer);
  if (lib.q) { lib.q = ''; reloadLibrary(); }
};

/* ---------- scroll to top ---------- */
const toTopBtn = $('toTop');
addEventListener('scroll', () => {
  toTopBtn.style.display = scrollY > 400 ? 'block' : 'none';
  if (scrollY < 50) {
    if (lib.stale && !lib.loading) { lib.stale = false; silentRefresh(); }
  } else {
    lib.stale = true;
  }
}, { passive: true });
toTopBtn.onclick = () => scrollTo({ top: 0, behavior: 'smooth' });

/* ---------- delete confirmation ---------- */
let delTarget = null;
function confirmDelete(it) {
  delTarget = it;
  $('delTitle').textContent = `Delete “${it.filename}”?`;
  $('delModal').style.display = 'flex';
}
$('delCancel').onclick = () => { $('delModal').style.display = 'none'; delTarget = null; };
$('delConfirm').onclick = async () => {
  const it = delTarget;
  $('delModal').style.display = 'none';
  delTarget = null;
  if (!it) return;
  try {
    const r = await fetch(`/api/library/${it.id}`, { method: 'DELETE' });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    it._row.remove();
    lib.total = Math.max(0, lib.total - 1);
    if (lib.firstKey && lib.firstKey.split('\n').includes(it.filename)) lib.firstKey = null;
    showLibSearch();
    showLibEmpty();
  } catch (e) { alert(`Delete failed: ${e.message}`); }
};

/* ---------- trim modal (local files) ---------- */
const trim = { start: 0, end: 0, duration: 0, peaks: null, step: 1, hover: null, buffer: null, loaded: false, loading: false, file: null };
let audioCtx = null, playSource = null;
let playhead = null, playStartCtx = 0, playStartOffset = 0, rafId = null;
const canvas = $('wave'), cctx = canvas.getContext('2d');

function setWaveMsg(m) { $('waveMsg').textContent = m; $('waveMsg').style.display = m ? 'flex' : 'none'; }

function openTrim(item) {
  stopTrimPlay();
  playhead = null;
  trim.file = item;
  trim.loaded = false; trim.buffer = null; trim.peaks = null; trim.hover = null;
  trim.start = 0; trim.end = 0; trim.duration = 0;
  cctx.clearRect(0, 0, canvas.width, canvas.height);
  $('trimStart').value = '0:00'; $('trimEnd').value = '0:00';
  $('trimTitle').textContent = item.filename;
  const cover = $('trimCover');
  cover.style.display = 'block';
  cover.onerror = () => { cover.style.display = 'none'; };
  cover.src = `/api/library/${item.id}/cover`;
  $('trimResult').style.display = 'none';
  $('trimModal').style.display = 'flex';
  loadWaveformLocal(item.id);
}
$('trimCancel').onclick = () => { stopTrimPlay(); $('trimModal').style.display = 'none'; };
$('trimExpandBtn').onclick = () => {
  const box = $('trimModal').querySelector('.modal-box');
  box.classList.toggle('expanded');
  $('trimExpandBtn').textContent = box.classList.contains('expanded') ? '⤡' : '⤢';
  if (trim.loaded) { sizeCanvas(); drawWave(); }
};

async function fetchDecode(body) {
  const r = await fetch('/api/trim-preview', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  const {id} = await r.json();
  const ab = await (await fetch(`/api/trim/${id}`)).arrayBuffer();
  return audioCtx.decodeAudioData(ab);
}
async function loadWaveformLocal(fileId) {
  trim.loading = true;
  setWaveMsg('loading waveform…');
  try {
    audioCtx = audioCtx || new AudioContext();
    try {
      trim.buffer = await fetchDecode({file_id: fileId});
    } catch (e) {
      trim.buffer = await fetchDecode({file_id: fileId, mp3: true});
    }
    trim.duration = trim.buffer.duration;
    trim.start = 0; trim.end = trim.duration;
    trim.loaded = true;
    setWaveMsg('');
    sizeCanvas(); drawWave(); syncTrimInputs();
  } catch (e) { setWaveMsg('waveform failed: ' + e.message); }
  finally { trim.loading = false; }
}

function sizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(canvas.clientWidth * dpr);
  canvas.height = Math.floor(canvas.clientHeight * dpr);
  if (trim.buffer) computePeaks(canvas.clientWidth);
}
const WAVE_STEPS = [0.05, 0.1, 0.2, 0.25, 0.5, 1, 1.5, 2, 3, 5, 10, 15, 30];
function pickStep(duration, px) {
  for (const s of WAVE_STEPS) if (duration / s <= px / 2) return s;
  return WAVE_STEPS[WAVE_STEPS.length - 1];
}
function computePeaks(px) {
  const data = trim.buffer.getChannelData(0);
  const sr = trim.buffer.sampleRate, dur = trim.buffer.duration;
  const step = trim.step = pickStep(dur, px);
  const n = Math.max(1, Math.ceil(dur / step));
  const spb = Math.max(1, Math.round(sr * step));
  const peaks = new Array(n);
  for (let i = 0; i < n; i++) {
    let min = 1, max = -1;
    const start = i * spb;
    const end = Math.min(data.length, start + spb);
    for (let j = start; j < end; j++) {
      const v = data[j];
      if (v < min) min = v;
      if (v > max) max = v;
    }
    if (min === 1) min = 0;
    if (max === -1) max = 0;
    peaks[i] = [min, max];
  }
  trim.peaks = peaks;
}
function fmtRuler(s) {
  const m = Math.floor(s / 60), sec = String(Math.floor(s % 60)).padStart(2, '0');
  return `${String(m).padStart(2, '0')}:${sec}`;
}
function tickInterval(duration) {
  const candidates = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600];
  for (const c of candidates) if (duration / c <= 12) return c;
  return 1200;
}
function drawWave() {
  const W = canvas.width, H = canvas.height, dpr = window.devicePixelRatio || 1;
  const rulerH = 22 * dpr, waveH = H - rulerH, mid = waveH / 2;
  cctx.clearRect(0, 0, W, H);
  if (!trim.peaks) return;
  const n = trim.peaks.length;
  const sx = trim.start / trim.duration * W, ex = trim.end / trim.duration * W;
  const slot = W / n;
  const bw = Math.max(1 * dpr, Math.min(3 * dpr, Math.floor(slot * 0.5)));
  if (trim.hover != null) {
    cctx.fillStyle = 'rgba(255,255,255,.07)';
    cctx.fillRect(trim.hover * slot, 0, slot, waveH);
  }
  for (let i = 0; i < n; i++) {
    const [min, max] = trim.peaks[i];
    const cx = (i + 0.5) * slot;
    const inSel = cx >= sx && cx <= ex;
    cctx.fillStyle = i === trim.hover ? (inSel ? '#e06068' : '#e6e6e6') : (inSel ? '#93343a' : '#48484a');
    const y1 = mid - max * mid * 0.98, y2 = mid - min * mid * 0.98;
    cctx.fillRect(cx - bw / 2, y1, bw, Math.max(1 * dpr, y2 - y1));
  }
  // time ruler
  const iv = tickInterval(trim.duration);
  cctx.fillStyle = '#8a8f98';
  cctx.font = `${11 * dpr}px system-ui`;
  cctx.textBaseline = 'top';
  for (let t = 0; t <= trim.duration; t += iv) {
    const x = t / trim.duration * W;
    cctx.fillRect(x, waveH, 1 * dpr, 4 * dpr);
    const label = fmtRuler(t);
    const lx = Math.min(Math.max(x, 2 * dpr), W - label.length * 6.5 * dpr);
    cctx.fillText(label, lx, waveH + 6 * dpr);
  }
  // selection boundary handles: bars with grip notch
  const hw = Math.max(2, Math.round(3 * dpr));
  for (const x of [sx, ex]) {
    cctx.fillStyle = '#c9474c';
    cctx.fillRect(x - hw / 2, 0, hw, waveH);
    cctx.fillStyle = '#75282d';
    cctx.fillRect(x - hw / 2, mid - 8 * dpr, hw, 16 * dpr);
  }
  if (playhead != null) {
    const px = playhead / trim.duration * W;
    cctx.fillStyle = '#ffffff';
    cctx.fillRect(px - dpr, 0, 2 * dpr, waveH);
    cctx.beginPath(); cctx.arc(px, 7 * dpr, 5 * dpr, 0, Math.PI * 2); cctx.fill();
  }
}

let drag = null;
canvas.addEventListener('pointerdown', e => {
  if (!trim.loaded) return;
  const x = e.clientX - canvas.getBoundingClientRect().left;
  drag = {startX: x, mode: null, moved: false, offset: 0};
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  const x = e.clientX - canvas.getBoundingClientRect().left;
  if (!drag) {
    if (!trim.loaded || !trim.peaks) return;
    const idx = Math.max(0, Math.min(trim.peaks.length - 1, Math.floor(x / canvas.clientWidth * trim.peaks.length)));
    if (idx !== trim.hover) { trim.hover = idx; drawWave(); }
    return;
  }
  if (!drag.moved) {
    if (Math.abs(x - drag.startX) <= 4) return;
    drag.moved = true;
    stopTrimPlay();
    const w = canvas.clientWidth;
    const t = drag.startX / w * trim.duration;
    const sx = trim.start / trim.duration * w, ex = trim.end / trim.duration * w;
    if (Math.abs(drag.startX - sx) <= 10) drag.mode = 'start';
    else if (Math.abs(drag.startX - ex) <= 10) drag.mode = 'end';
    else if (drag.startX > sx && drag.startX < ex) { drag.mode = 'window'; drag.offset = t - trim.start; }
    else if (Math.abs(drag.startX - sx) < Math.abs(drag.startX - ex)) drag.mode = 'start';
    else drag.mode = 'end';
  }
  applyDrag(x);
});
canvas.addEventListener('pointerup', e => {
  if (drag && !drag.moved) {
    const x = e.clientX - canvas.getBoundingClientRect().left;
    const t = Math.max(0, Math.min(trim.duration, x / canvas.clientWidth * trim.duration));
    seekAndPlay(t);
  }
  drag = null;
});
canvas.addEventListener('pointerleave', () => {
  if (trim.hover != null) { trim.hover = null; drawWave(); }
});
function applyDrag(x) {
  const w = canvas.clientWidth;
  const t = Math.max(0, Math.min(trim.duration, x / w * trim.duration));
  if (drag.mode === 'start') trim.start = Math.min(t, trim.end - 0.1);
  else if (drag.mode === 'end') trim.end = Math.max(t, trim.start + 0.1);
  else {
    const len = trim.end - trim.start;
    const s = Math.max(0, Math.min(trim.duration - len, t - drag.offset));
    trim.start = s; trim.end = s + len;
  }
  drawWave(); syncTrimInputs();
}
function syncTrimInputs() {
  $('trimStart').value = fmtDur(trim.start);
  $('trimEnd').value = fmtDur(trim.end);
}
['trimStart', 'trimEnd'].forEach(id => $(id).onchange = () => {
  const s = parseTime($('trimStart').value), e2 = parseTime($('trimEnd').value);
  if (s == null || e2 == null || e2 <= s) { syncTrimInputs(); return; }
  trim.start = Math.max(0, s);
  trim.end = Math.min(trim.duration, e2);
  drawWave(); syncTrimInputs();
});

function stopTrimPlay() {
  if (playSource) { try { playSource.stop(); } catch (e) {} playSource = null; }
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (trim.loaded) drawWave();
  $('trimStopBtn').style.display = 'none';
  $('trimPlayBtn').style.display = 'inline-block';
}
let playStopAt = 0;
function tickPlayhead() {
  if (!playSource) return;
  const pos = playStartOffset + (audioCtx.currentTime - playStartCtx);
  playhead = Math.min(pos, playStopAt);
  drawWave();
  if (pos >= playStopAt) { stopTrimPlay(); return; }
  rafId = requestAnimationFrame(tickPlayhead);
}
function playFrom(start, stopAt) {
  stopTrimPlay();
  audioCtx = audioCtx || new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const src = audioCtx.createBufferSource();
  src.buffer = trim.buffer;
  src.connect(audioCtx.destination);
  src.start(0, start, stopAt - start);
  src.onended = () => { if (playSource === src) stopTrimPlay(); };
  playSource = src;
  playStartCtx = audioCtx.currentTime;
  playStartOffset = start;
  playStopAt = stopAt;
  playhead = start;
  rafId = requestAnimationFrame(tickPlayhead);
  $('trimStopBtn').style.display = 'inline-block';
  $('trimPlayBtn').style.display = 'none';
}
function seekAndPlay(t) {
  playhead = t;
  const inSel = t >= trim.start && t < trim.end;
  playFrom(t, inSel ? trim.end : trim.duration);
}
$('trimPlayBtn').onclick = () => {
  if (!trim.loaded) return;
  const from = playhead != null && playhead >= trim.start && playhead < trim.end ? playhead : trim.start;
  playFrom(from, trim.end);
};
$('trimStopBtn').onclick = stopTrimPlay;
window.addEventListener('resize', () => { if (trim.loaded && $('trimModal').style.display === 'flex') { sizeCanvas(); drawWave(); } });

$('trimCutBtn').onclick = async () => {
  if (!trim.loaded || !trim.file) return;
  if (trim.start <= 0.05 && trim.end >= trim.duration - 0.05) {
    $('trimResult').textContent = 'Select a range smaller than the whole track.';
    $('trimResult').style.display = 'block';
    return;
  }
  $('trimCutBtn').disabled = true;
  try {
    const r = await fetch('/api/trim-local', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({file_id: trim.file.id, trim: {start: +trim.start.toFixed(2), end: +trim.end.toFixed(2)}})
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const res = await r.json();
    $('trimResult').innerHTML = '';
    const a = document.createElement('a');
    a.href = `/api/file-by-name/${encodeURIComponent(res.filename)}`;
    a.textContent = res.filename;
    $('trimResult').append('Created: ', a);
    $('trimResult').style.display = 'block';
    refreshLibrary();
  } catch (e) {
    $('trimResult').textContent = e.message;
    $('trimResult').style.display = 'block';
  } finally { $('trimCutBtn').disabled = false; }
};

refreshLibrary();
</script>
</body>
</html>
